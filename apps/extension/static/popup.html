<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout money agent</title>
<style>
  :root {
    --color-bg: #f7f7f5; --color-surface: #ffffff; --color-surface-2: #efefeb;
    --color-text: #1a1a1f; --color-text-muted: #6b6b78; --color-border: #e3e3dd;
    --color-accent: #c97b1a; --color-accent-bg: #fef4e2;
    --color-stop: #b4443c;
    --radius-sm: 8px; --radius-md: 14px;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #111115; --color-surface: #1a1a21; --color-surface-2: #22222b;
      --color-text: #ececf1; --color-text-muted: #9a9aa8; --color-border: #2b2b36;
      --color-accent-bg: #2a1d08;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 300px; padding: var(--space-4); background: var(--color-bg); color: var(--color-text); font: 13px/1.4 var(--font-sans); }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
  .label { color: var(--color-text-muted); font-size: 12px; }
  .big { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; margin: 2px 0 var(--space-2); font-variant-numeric: tabular-nums; }
  .row { display: flex; justify-content: space-between; gap: var(--space-2); padding: var(--space-1) 0; }
  .row b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .error { color: var(--color-stop); }
  .buttons { display: grid; gap: var(--space-2); margin-top: var(--space-3); }
  button { font: inherit; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); cursor: pointer; }
  button.primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .paused { margin-top: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); background: var(--color-accent-bg); font-size: 12px; }
  details { margin-top: var(--space-3); color: var(--color-text-muted); }
  summary { cursor: pointer; font-size: 12px; }
  form { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
  input { flex: 1; min-width: 0; font: inherit; padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); }
  .hint { font-size: 11px; margin-top: var(--space-2); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card" id="summary" aria-live="polite">
    <div class="label">Safe to spend</div>
    <div class="big" id="safe">…</div>
    <div class="row"><span class="label">Next income</span><b id="income">…</b></div>
    <div class="row"><span class="label">Next bill</span><b id="bill">…</b></div>
    <div class="error" id="error" hidden></div>
  </div>
  <div class="paused" id="pausedNote" hidden></div>
  <div class="buttons">
    <button id="pause" type="button">Pause for 1 hour</button>
    <button id="dashboard" class="primary" type="button">Open dashboard</button>
  </div>
  <details>
    <summary>Settings</summary>
    <form id="urlForm">
      <input id="webUrl" type="url" aria-label="WEB_URL" placeholder="http://localhost:3000" spellcheck="false">
      <button type="submit">Save</button>
    </form>
    <div class="hint">Shortcut on a checkout page: Alt+Shift+N (Option+Shift+N on Mac).</div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
